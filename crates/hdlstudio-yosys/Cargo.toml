[package]
name = "hdlstudio-yosys"
description = "Yosys JSON netlist to HDL Studio circuit: conversion, I/O widgets, inout split, simplifications"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hdlstudio-logic = { path = "../hdlstudio-logic" }
hdlstudio-netlist = { path = "../hdlstudio-netlist" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
